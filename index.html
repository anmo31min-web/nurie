<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff8f2">
<title>のいちゃんのぬりえ</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="app">
  <header class="top">
    <div>
      <h1>のいちゃんのぬりえ</h1>
      <p>数字をぬって、イラストを咲かせよう</p>
    </div>
    <div class="topActions">
      <button class="smallBtn" id="uploadBtn" type="button">画像</button>
      <button class="smallBtn" id="resetBtn" type="button" aria-label="ぬりえをリセット">↻</button>
    </div>
  </header>

  <div class="progress"><i id="progressBar"></i></div>

  <section class="board" id="board">
    <canvas id="game" aria-label="数字ぬりえ"></canvas>
    <div class="status" id="status" role="status" aria-live="polite">画像を数字ぬりえに変換しています…</div>
  </section>

  <footer>
    <div class="done" id="done" role="status">
      <span>できあがり ♡</span>
      <details>
        <summary>メニュー</summary>
        <div class="finishActions">
          <button class="smallBtn" id="saveBtn" type="button">画像を保存</button>
          <button class="smallBtn" id="againBtn" type="button">もういちど</button>
        </div>
      </details>
    </div>
    <div class="palette" id="palette" aria-label="色を選ぶ"></div>
    <div class="note" id="note"><span id="noteText">数字と同じ色を選んで、領域をタップ</span><label class="detailToggle"><input id="detailToggle" type="checkbox" checked> 細い線を表示（模様）</label></div>
    <div class="viewControls" aria-label="表示操作">
      <button class="smallBtn" id="zoomOut" type="button" aria-label="縮小">−</button>
      <button class="smallBtn" id="zoomReset" type="button">全体</button>
      <button class="smallBtn" id="zoomIn" type="button" aria-label="拡大">＋</button>
    </div>
  </footer>

  <input id="upload" type="file" accept="image/*" hidden>
</main>
<script src="detail-lines.js"></script>
<script src="app.js"></script>
</body>
</html>
