<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#fff8f2">
<title>のいちゃんのぬりえ</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="app">
  <header class="top">
    <div>
      <h1>のいちゃんのぬりえ</h1>
      <p>8色の数字ぬりえ</p>
    </div>
    <div class="topActions">
      <button class="smallBtn" id="uploadBtn">画像</button>
      <button class="smallBtn" id="resetBtn">↻</button>
    </div>
  </header>

  <div class="progress"><i id="progressBar"></i></div>

  <section class="board" id="board">
    <canvas id="game" aria-label="数字ぬりえ"></canvas>
    <div class="status" id="status">画像を数字ぬりえに変換しています…</div>
    <div class="done" id="done">
      <div class="doneCard">
        <div class="doneMark">✓</div>
        <strong>完成！</strong>
        <button id="againBtn">もういちど</button>
      </div>
    </div>
  </section>

  <footer>
    <div class="palette" id="palette" aria-label="色を選ぶ"></div>
    <div class="note" id="note">数字と同じ色を選んで、領域をタップ</div>
  </footer>

  <input id="upload" type="file" accept="image/*" hidden>
</main>
<script src="app.js"></script>
</body>
</html>
